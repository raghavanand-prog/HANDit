version: 2
updates:
  # JavaScript dependencies of the site, the Worker and the tests (one lock file at the root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  # The pinned GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
